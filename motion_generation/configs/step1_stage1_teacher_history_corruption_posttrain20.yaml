paths:
  # Supply the completed clean teacher through --init_from_checkpoint.
  base_model: checkpoints/llm
  output_dir: checkpoints/step1_stage1_teacher_history_corruption_posttrain20
  data_dir: SuSuInterActs/SuSuInterActs
  motion_token_dir: SuSuInterActs/SuSuInterActs/motion_token_data_multipart_causal_512x4
  audio_token_dir: SuSuInterActs/SuSuInterActs/audio_tokens_moss_nano_48k_12p5hz_16cb
  text_json: SuSuInterActs/SuSuInterActs/text_data/motion2text.json
  train_split: SuSuInterActs/SuSuInterActs/split/train_file_list.txt
  eval_split: SuSuInterActs/SuSuInterActs/split/val_file_list.txt

data:
  fixed_gap: 3
  max_length: 4096
  num_workers: 4
  persistent_workers: false
  require_causal_motion: true
  max_duration_mismatch_seconds: 0.12
  seed_mode: mixed_known
  neutral_seed_json: null
  neutral_seed_probability: 0.5
  previous_seed_probability: 0.5
  generated_anchor_dir: null
  generated_prefix_probability: 0.0

audio:
  codec: moss_audio_tokenizer_nano
  sample_rate: 48000
  frame_rate: 12.5
  frame_size: 3840
  stored_codebooks: 16
  cardinality: 1024
  codebooks_used: [0, 1, 2, 3]
  input_representation: ordinary_tokens

text:
  serialization: structured_fields
  fields: [expression, action, transcript]
  missing_markers: true

planner_context:
  attention_mode: prefix_lm
  sequence_layout: full_audio_prefix

provided_gap_training:
  enabled: true
  distribution: uniform
  min_gap: 3
  max_gap: 15
  resample_each_epoch: true

adaptive_gap:
  enabled: false

# Retained in the codebase for later experiments but disabled in this run.
generated_history:
  enabled: false

history_corruption:
  enabled: true
  # For each selected history anchor: use a complete GT anchor from another
  # batch example 75% of the time; otherwise copy the preceding anchor.
  donor_probability: 0.75
  curriculum:
    - start_epoch: 1
      end_epoch: 4
      example_probability: 0.20
      anchor_probability: 0.20
    - start_epoch: 5
      end_epoch: 10
      example_probability: 0.40
      anchor_probability: 0.30
    - start_epoch: 11
      end_epoch: 20
      example_probability: 0.60
      anchor_probability: 0.40

visited_state_guidance:
  enabled: false

frozen_step2_guidance:
  enabled: false

auxiliary_loss:
  type: none

condition_alignment:
  enabled: false
  evaluate: false
  modalities: []
  eval_modalities: []

training:
  seed: 42
  num_train_epochs: 20
  # 32 examples/GPU x 4 GPUs = global batch 128.
  per_device_train_batch_size: 32
  per_device_eval_batch_size: 32
  gradient_accumulation_steps: 1
  learning_rate: 5.0e-6
  weight_decay: 0.01
  adam_betas: [0.9, 0.95]
  adam_epsilon: 1.0e-8
  warmup_ratio: 0.02
  max_grad_norm: 1.0
  bf16: true
  gradient_checkpointing: true
  logging_steps: 10
  eval_steps: 0
  save_steps: 745
  save_best: true
  milestone_epochs: [4, 10, 20]
  early_stopping_patience: 0

monitoring:
  report_to: wandb
  wandb_project: sentiavatar-step1-planner
  wandb_run_name: step1_stage1_teacher_history_corruption_posttrain20
  wandb_tags:
    [step1, stage1-posttrain, history-corruption, batch-donor, previous-copy, prefix-lm, full-data, nano, q0q3, structured-text, 20-epochs]
  wandb_mode: online
  wandb_entity: null
