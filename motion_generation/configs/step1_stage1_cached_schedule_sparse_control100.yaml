paths:
  # Matched control: same initialization, targets, anchor schedule, vocabulary,
  # optimization and context, but no dense Step 2-completed motion history.
  base_model: checkpoints/llm
  output_dir: checkpoints/step1_stage1_cached_schedule_sparse_control100
  data_dir: SuSuInterActs/SuSuInterActs
  motion_token_dir: SuSuInterActs/SuSuInterActs/motion_token_data_multipart_causal_512x4
  audio_token_dir: SuSuInterActs/SuSuInterActs/audio_tokens_moss_nano_48k_12p5hz_16cb
  text_json: SuSuInterActs/SuSuInterActs/text_data/motion2text.json
  train_split: SuSuInterActs/SuSuInterActs/split/train_file_list.txt
  eval_split: SuSuInterActs/SuSuInterActs/split/val_file_list.txt

data:
  fixed_gap: 3
  max_length: 8192
  num_workers: 4
  persistent_workers: false
  require_causal_motion: true
  max_duration_mismatch_seconds: 0.12
  seed_mode: observed
  neutral_seed_json: null
  neutral_seed_probability: 0.0
  previous_seed_probability: 0.0
  generated_anchor_dir: null
  generated_prefix_probability: 0.0

audio:
  codec: moss_audio_tokenizer_nano
  sample_rate: 48000
  frame_rate: 12.5
  frame_size: 3840
  stored_codebooks: 16
  cardinality: 1024
  codebooks_used: [0, 1, 2, 3]
  input_representation: ordinary_tokens

text:
  serialization: structured_fields
  fields: [expression, action, transcript]
  missing_markers: true

planner_context:
  attention_mode: prefix_lm
  sequence_layout: full_audio_prefix

provided_gap_training:
  enabled: true
  distribution: uniform
  min_gap: 3
  max_gap: 15
  resample_each_epoch: false
  schedule_cache_dir: checkpoints/step1_gt_boundary_step2_history_uniform_gap_seed42

step2_history:
  enabled: false
  # Keep candidate/control vocabularies and initialization shapes identical.
  register_tokens: true
  cache_dir: null
  min_frames: 1
  max_frames: 15
  corruption:
    enabled: false

adaptive_gap:
  enabled: false

generated_history:
  enabled: false

visited_state_guidance:
  enabled: false

frozen_step2_guidance:
  enabled: false

history_corruption:
  enabled: false

auxiliary_loss:
  type: none

condition_alignment:
  enabled: false
  evaluate: false
  modalities: []
  eval_modalities: []

training:
  seed: 42
  num_train_epochs: 100
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-5
  weight_decay: 0.01
  adam_betas: [0.9, 0.95]
  adam_epsilon: 1.0e-8
  warmup_ratio: 0.03
  max_grad_norm: 1.0
  bf16: true
  gradient_checkpointing: true
  logging_steps: 10
  eval_steps: 0
  save_steps: 745
  save_best: true
  milestone_epochs: [25, 50, 75, 100]
  early_stopping_patience: 0

monitoring:
  report_to: wandb
  wandb_project: sentiavatar-step1-planner
  wandb_run_name: step1_stage1_cached_schedule_sparse_control100
  wandb_tags:
    [step1, stage1, control, sparse-history, anchor-ce-only, cached-schedule, supplied-gap, uniform-gap, full-audio, prefix-lm, nano, q0q3, 100-epochs]
  wandb_mode: online
  wandb_entity: null
