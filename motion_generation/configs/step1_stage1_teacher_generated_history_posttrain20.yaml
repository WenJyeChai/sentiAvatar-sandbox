paths:
  # Pass the completed 50-epoch clean teacher with --init_from_checkpoint.
  # checkpoints/llm remains only the fallback for path/config validation.
  base_model: checkpoints/llm
  output_dir: checkpoints/step1_stage1_teacher_generated_history_posttrain20
  data_dir: SuSuInterActs/SuSuInterActs
  motion_token_dir: SuSuInterActs/SuSuInterActs/motion_token_data_multipart_causal_512x4
  audio_token_dir: SuSuInterActs/SuSuInterActs/audio_tokens_moss_nano_48k_12p5hz_16cb
  text_json: SuSuInterActs/SuSuInterActs/text_data/motion2text.json
  train_split: SuSuInterActs/SuSuInterActs/split/train_file_list.txt
  eval_split: SuSuInterActs/SuSuInterActs/split/val_file_list.txt

data:
  fixed_gap: 3
  max_length: 4096
  num_workers: 4
  persistent_workers: false
  require_causal_motion: true
  max_duration_mismatch_seconds: 0.12
  seed_mode: mixed_known
  neutral_seed_json: null
  neutral_seed_probability: 0.5
  previous_seed_probability: 0.5
  generated_anchor_dir: null
  generated_prefix_probability: 0.0

audio:
  codec: moss_audio_tokenizer_nano
  sample_rate: 48000
  frame_rate: 12.5
  frame_size: 3840
  stored_codebooks: 16
  cardinality: 1024
  codebooks_used: [0, 1, 2, 3]
  input_representation: ordinary_tokens

text:
  serialization: structured_fields
  fields: [expression, action, transcript]
  missing_markers: true

planner_context:
  # Complete text/audio remain a bidirectional condition prefix. Only the
  # sparse anchor plan is generated autoregressively.
  attention_mode: prefix_lm
  sequence_layout: full_audio_prefix

provided_gap_training:
  enabled: true
  distribution: uniform
  min_gap: 3
  max_gap: 15
  resample_each_epoch: true

adaptive_gap:
  enabled: false

generated_history:
  enabled: true
  decoding: greedy
  # Prefix-LM rows must be rolled independently because condition-prefix
  # lengths differ. The four GPUs still process independent rows concurrently.
  rollout_microbatch_size: 1
  rollout_eval_clips: 128
  rollout_eval_epochs: [3, 7, 12, 20]
  milestone_epochs: [3, 7, 12, 20]
  start_immediately: true
  minimum_teacher_epochs: 0
  ramp_epochs: 0
  max_probability: 0.6
  curriculum:
    # The depth is the number of generated previous anchors seen by the final
    # anchor of a coherent local suffix.
    - start_epoch: 1
      end_epoch: 3
      probability: 0.2
      min_previous_anchors: 1
      max_previous_anchors: 2
      full_prefix_probability: 0.0
    - start_epoch: 4
      end_epoch: 7
      probability: 0.4
      min_previous_anchors: 1
      max_previous_anchors: 4
      full_prefix_probability: 0.0
    - start_epoch: 8
      end_epoch: 12
      probability: 0.6
      min_previous_anchors: 1
      max_previous_anchors: 4
      full_prefix_probability: 0.5
    - start_epoch: 13
      end_epoch: 20
      probability: 0.6
      min_previous_anchors: 1
      max_previous_anchors: 4
      full_prefix_probability: 1.0

visited_state_guidance:
  enabled: false

frozen_step2_guidance:
  enabled: false

auxiliary_loss:
  type: none

condition_alignment:
  enabled: false
  evaluate: false
  modalities: []
  eval_modalities: []

training:
  seed: 42
  num_train_epochs: 20
  # 32 examples/GPU x 4 GPUs = global batch 128.
  per_device_train_batch_size: 32
  per_device_eval_batch_size: 32
  gradient_accumulation_steps: 1
  learning_rate: 5.0e-6
  weight_decay: 0.01
  adam_betas: [0.9, 0.95]
  adam_epsilon: 1.0e-8
  warmup_ratio: 0.02
  max_grad_norm: 1.0
  bf16: true
  gradient_checkpointing: true
  logging_steps: 10
  eval_steps: 0
  save_steps: 745
  save_best: true
  milestone_epochs: [3, 7, 12, 20]
  early_stopping_patience: 0

monitoring:
  report_to: wandb
  wandb_project: sentiavatar-step1-planner
  wandb_run_name: step1_stage1_teacher_generated_history_posttrain20
  wandb_tags:
    [step1, stage1-posttrain, generated-history, suffix-to-full, prefix-lm, full-data, nano, q0q3, ordinary-audio-tokens, structured-text, 20-epochs]
  wandb_mode: online
  wandb_entity: null
