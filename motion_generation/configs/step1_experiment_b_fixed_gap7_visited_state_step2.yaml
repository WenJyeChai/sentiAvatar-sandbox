paths:
  base_model: checkpoints/llm
  output_dir: checkpoints/step1_experiment_b_fixed_gap7_visited_state_step2_6k
  data_dir: SuSuInterActs/SuSuInterActs
  motion_token_dir: SuSuInterActs/SuSuInterActs/motion_token_data_multipart_causal_512x4
  audio_token_dir: SuSuInterActs/SuSuInterActs/audio_tokens_moss_nano_48k_12p5hz_16cb
  text_json: SuSuInterActs/SuSuInterActs/text_data/motion2text.json
  train_split: motion_generation/data_splits/step1_balanced_seed42/train_step1_main_6000.txt
  eval_split: SuSuInterActs/SuSuInterActs/split/val_file_list.txt

data:
  # Experiment B changes endpoint exposure, not placement or data.
  fixed_gap: 7
  max_length: 2560
  num_workers: 4
  persistent_workers: false
  require_causal_motion: true
  max_duration_mismatch_seconds: 0.12
  seed_mode: mixed_known
  neutral_seed_json: null
  neutral_seed_probability: 0.5
  previous_seed_probability: 0.5
  generated_anchor_dir: null
  generated_prefix_probability: 0.0

audio:
  codec: moss_audio_tokenizer_nano
  sample_rate: 48000
  frame_rate: 12.5
  frame_size: 3840
  stored_codebooks: 16
  cardinality: 1024
  codebooks_used: [0, 1, 2, 3]
  fusion: concat_linear
  sparse_audio_embedding: true

text:
  serialization: structured_fields
  fields: [expression, action, transcript]
  missing_markers: true

adaptive_gap:
  enabled: false

generated_history:
  # Experiment B is a local visited-state rollout, not generic self-forcing.
  enabled: false
  decoding: greedy
  start_immediately: false
  minimum_teacher_epochs: 5
  ramp_epochs: 10
  max_probability: 0.0
  rollout_microbatch_size: 8
  rollout_eval_clips: 64
  teacher_forced_ce_max: 5.4
  rollout_accuracy_min: 0.01
  rollout_q0_accuracy_min: 0.03
  rollout_eval_epochs: [5]
  milestone_epochs: [5]

visited_state_guidance:
  # Half the rows roll only the one/two anchors immediately before the
  # selected interval. The remaining half are exact GT-history replay.
  enabled: true
  probability: 0.5
  rollout_depths: [1, 2]
  rollout_microbatch_size: 8

auxiliary_loss:
  type: none

condition_alignment:
  enabled: false
  evaluate: false
  modalities: []
  eval_modalities: []

frozen_step2_guidance:
  enabled: true
  source_config: motion_generation/configs/audio_c2f_body_causal_moss_nano_all16_soft_recovery_sf05_stage2.yaml
  checkpoint: checkpoints/mask_multipart_body_causal_moss_nano_all16_variable_c2f_soft_recovery_sf05_stage2_gap1_15
  # Frozen Step 2 sees the detached left anchor currently present in Step 1's
  # local visited state and a hard-forward/ST-backward predicted right anchor.
  left_boundary_mode: planner_history
  # Group zero has no predicted previous anchor, so it is excluded.
  min_anchor_group: 1
  # Exclude shortened EOS tails from this controlled fixed-gap experiment.
  required_gap: 7
  weight: 0.05
  warmup_epochs: 0.0
  temperature: 1.0

training:
  seed: 42
  num_train_epochs: 5
  per_device_train_batch_size: 32
  per_device_eval_batch_size: 32
  gradient_accumulation_steps: 1
  learning_rate: 2.0e-6
  weight_decay: 0.01
  adam_betas: [0.9, 0.95]
  adam_epsilon: 1.0e-8
  warmup_ratio: 0.03
  max_grad_norm: 1.0
  bf16: true
  gradient_checkpointing: true
  logging_steps: 10
  eval_steps: 0
  save_steps: 47
  save_best: true
  early_stopping_patience: 0

monitoring:
  report_to: wandb
  wandb_project: sentiavatar-step1-planner
  wandb_run_name: step1_experiment_b_fixed_gap7_visited_state_step2_6k
  wandb_tags:
    [phase1, experiment-b, fixed-gap7, frozen-step2-online, visited-state, dagger-like, hard-st, GT-replay, main6k, nano, q0q3, structured-text]
  wandb_mode: online
  wandb_entity: null
